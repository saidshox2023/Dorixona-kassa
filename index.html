<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dorixonachilar kassasi</title>
<meta name="description" content="Dorixonachilar oylik kassasi: kim qancha berdi, kimda nechta kassa qoldi, olganning imzosi va dollar kursi.">
<meta name="theme-color" content="#EDF0EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1219" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kassa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=IBM+Plex+Mono:wght@500;600&family=Onest:wght@400;500;600;700&display=swap">
<style id="app-css">

:root{
  --ground:#EDF0EF; --paper:#FBFCFA; --grid:#E3E9EC; --surface:#F5F7F6;
  --ink:#18213B; --ink-2:#586277; --ink-3:#8B94A7; --line:#D3DADF;
  --pen:#2442B5; --pen-ink:#FFFFFF; --pen-soft:#E4E9FA;
  --paid:#1D7549; --paid-soft:#DFF1E6; --due:#AE3F29; --due-soft:#F7E4DE;
  --shadow:0 1px 0 rgba(24,33,59,.04), 0 10px 28px -16px rgba(24,33,59,.28);
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1219; --paper:#151B26; --grid:#1C2432; --surface:#121822;
    --ink:#E2E6F0; --ink-2:#A0A9BC; --ink-3:#6E7890; --line:#273042;
    --pen:#8EA5FF; --pen-ink:#0E1219; --pen-soft:#1C2647;
    --paid:#63C994; --paid-soft:#123022; --due:#F1907A; --due-soft:#3A1D17;
    --shadow:0 10px 28px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1219; --paper:#151B26; --grid:#1C2432; --surface:#121822;
  --ink:#E2E6F0; --ink-2:#A0A9BC; --ink-3:#6E7890; --line:#273042;
  --pen:#8EA5FF; --pen-ink:#0E1219; --pen-soft:#1C2647;
  --paid:#63C994; --paid-soft:#123022; --due:#F1907A; --due-soft:#3A1D17;
  --shadow:0 10px 28px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:22px 128px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
h1{font-size:28px;line-height:1.15;margin:4px 0 0;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px;border-block:1px solid var(--line)}
.stat{padding-block:12px;min-width:0}
.stat+.stat{border-left:1px solid var(--line);padding-left:14px}
.stat .k{font-size:12px;color:var(--ink-2)}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
.stat .s{font-size:12px;color:var(--ink-3)}

.tabs{display:flex;margin-top:14px;border-bottom:1px solid var(--line)}
.tab{flex:1;appearance:none;border:0;background:none;padding:12px 0 10px;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--pen);border-bottom-color:var(--pen)}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn.lg{min-height:50px;padding:12px 26px;font-size:16px}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.danger{color:var(--due)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 13px;font-weight:500;font-size:13px;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--pen);border-color:var(--pen)}

.sheet{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px;border:1px solid var(--line);border-radius:4px;padding:18px 16px 16px;box-shadow:var(--shadow)}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--pen);margin-bottom:6px}
.hand{font-family:var(--hand);font-weight:600;font-size:24px;line-height:1}
.hand-lg{font-size:36px}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;align-items:center;gap:10px;min-height:44px}
.rows.edit .row{grid-template-columns:22px minmax(0,1fr) 84px 44px 28px;gap:8px}
.no{font-family:var(--mono);color:var(--ink-3);font-size:13px}
.nm{font-weight:500;overflow-wrap:anywhere}
.took{font-size:22px;color:var(--pen);margin-left:4px;white-space:nowrap}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row.due .amt{color:var(--due)}
.mark{justify-self:end;display:flex;align-items:center;justify-content:center;min-width:44px;height:36px;color:var(--pen);background:none;border:0;padding:0}
.mark .tick{width:32px;height:24px}
.pending{font-size:11px;color:var(--due);font-weight:600;background:var(--due-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
button.mark{cursor:pointer;border-radius:8px}
button.mark:hover{background:var(--pen-soft)}
.box{width:22px;height:22px;border:1.5px dashed var(--ink-3);border-radius:4px}
.x{appearance:none;border:0;background:none;color:var(--ink-3);font-size:20px;line-height:1;width:28px;height:36px;cursor:pointer;border-radius:6px}
.x:hover{color:var(--due);background:var(--due-soft)}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:10px;border-top:2px solid var(--pen)}
.sum .lbl{font-size:13px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.big{font-size:26px}
.bar{height:6px;background:var(--pen-soft);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--paid);border-radius:3px}
.collect{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink-2);margin-top:8px}
.collect b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.collect .d b{color:var(--due)}
.unpaid{margin:12px 0 0;font-size:13px;color:var(--due);background:var(--due-soft);padding:8px 10px;border-radius:6px}
.allpaid{margin:12px 0 0;font-size:13px;color:var(--paid);background:var(--paid-soft);padding:8px 10px;border-radius:6px;font-weight:600}
.addrow{display:flex;gap:8px;margin-top:12px}

h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);font-weight:600;margin:26px 0 6px}
.facts{margin:0}
.fact{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.fact dt{color:var(--ink-2);font-size:13px;padding-top:1px}
.fact dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.fact dd small{display:block;color:var(--ink-2);font-weight:400;font-size:13px}
.fact .in{margin-top:-4px}

.won{margin-top:14px;padding:14px 16px;border-radius:8px;background:var(--pen-soft);display:grid;gap:12px}
.won-top{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.won .k{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.won .hand{font-size:34px;color:var(--pen)}
.won .r{text-align:right}
.won .r small{display:block;font-size:12px;color:var(--ink-2)}
.won.none{background:var(--surface);border:1px dashed var(--line);color:var(--ink-2);font-size:14px}
.won-edit{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.won-edit select{flex:1 1 200px}
.del{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-2)}

.in{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0;font-size:15px}
.in:focus{border-color:var(--pen);outline:none;box-shadow:0 0 0 3px var(--pen-soft)}
.amt-in{font-family:var(--mono);text-align:right;padding:6px 7px;font-size:14px}
select.in{padding-right:28px}

.summary{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);padding-block:14px 4px}
.summary b{font-family:var(--mono);color:var(--ink);font-weight:600}
.summary .d b{color:var(--due)}
.mlist{list-style:none;margin:0;padding:0}
.mrow{border-bottom:1px solid var(--line)}
.mbtn{appearance:none;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;text-align:left;background:none;border:0;padding-block:13px;cursor:pointer;align-items:center}
.mname{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.mmeta{grid-column:1 / -1;font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.mmeta b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.pill{font-size:12px;line-height:1.4;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--paid-soft);color:var(--paid)}
.pill.due{background:var(--due-soft);color:var(--due)}
.pill.won{background:var(--pen-soft);color:var(--pen)}
.pill.out{background:var(--surface);color:var(--ink-3);border:1px solid var(--line)}
.dots{display:inline-flex;gap:3px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pen)}
.dot.half{background:linear-gradient(90deg,var(--pen) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--pen)}
.dot.used{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.dot.used.half{background:linear-gradient(90deg,transparent 50%,transparent 50%)}
.hist{list-style:none;margin:0 0 12px;padding:10px 12px;background:var(--surface);border-radius:6px;font-size:13px}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding-block:4px;align-items:center}
.hist .amt{font-size:13px}
.hist .muted{color:var(--ink-3)}
.medit{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding-block:10px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.stepper button{appearance:none;border:0;background:none;width:34px;height:38px;font-size:18px;cursor:pointer;color:var(--pen)}
.stepper span{min-width:62px;text-align:center;font-size:12px;line-height:1.2;color:var(--ink-2)}
.stepper span b{display:block;font-family:var(--mono);font-size:14px;color:var(--ink)}
.addform{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;margin-top:14px}
.note{font-size:13px;color:var(--ink-2);margin:10px 0 0}
.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.settings label{font-size:12px;color:var(--ink-2);display:grid;gap:4px}
.settings label:first-child{grid-column:1 / -1}

.lotstrip{display:grid;grid-template-columns:repeat(auto-fill,32px);gap:5px;margin-top:14px}
.lot{width:32px;height:32px;border:1px dashed var(--line);border-radius:3px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.lot.won{background:var(--pen);border:1px solid var(--pen);color:var(--pen-ink);font-weight:600}
.lotnote{font-size:13px;color:var(--ink-2);margin:10px 0 0}
.lotnote b{color:var(--ink);font-family:var(--mono);font-weight:600}
.lotnote strong{color:var(--ink);font-weight:600}
.ltable{margin-top:6px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 48px 48px 56px;gap:8px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.lhead{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em;font-weight:600;padding-block:6px}
.lhead span:not(:first-child),.lrow .n{text-align:right}
.lrow .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px}
.lrow .n.left{font-weight:600;color:var(--pen);font-size:18px}
.lrow.done .lname,.lrow.done .n{color:var(--ink-3)}
.lname{font-weight:600;overflow-wrap:anywhere;display:grid;gap:4px}
.sign{display:grid;gap:4px}
.sigline{height:88px;border-bottom:1.5px solid var(--ink-3);color:var(--pen)}
.sig{display:block;width:100%;height:100%}
.sigcap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
.sigmini{display:block;width:96px;height:38px;color:var(--pen)}
.pad{background:var(--paper);border:1.5px solid var(--pen);border-radius:8px;padding:12px;display:grid;gap:10px}
.pad-k{font-size:14px;line-height:1.45}
.pad-k b{font-weight:600}
.pad canvas{display:block;width:100%;aspect-ratio:5/2;max-width:100%;touch-action:none;color:var(--pen);background-color:var(--surface);background-image:linear-gradient(transparent calc(78% - 1px),var(--ink-3) calc(78% - 1px),var(--ink-3) 78%,transparent 78%);border-radius:6px;cursor:crosshair}
.pad-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.conv{text-align:right;font-size:12px;color:var(--ink-2);font-family:var(--mono);margin-top:2px}
.foot{margin-top:36px;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--ink-3);text-decoration:underline;cursor:pointer;font-size:12px}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:9px;border-bottom:1px solid var(--line)}
.plist .amt{font-size:14px}
.plist .rt{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.plist small{color:var(--ink-2);font-size:12px;display:block}
.empty{color:var(--ink-2);padding-block:20px}
.muted{color:var(--ink-3)}

.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);padding-inline:16px;padding-block:12px calc(12px + env(safe-area-inset-bottom));z-index:5}
.savebar .in-bar{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.savebar .msg{font-size:14px;font-weight:500}
.savebar .btn{background:transparent;color:var(--paper);border-color:var(--ink-3)}
.savebar .btn.primary{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.savebar .acts{display:flex;gap:8px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;font-size:14px;z-index:6;box-shadow:var(--shadow)}
@media (max-width:420px){
  h1{font-size:24px}
  .stat .v{font-size:17px}
  .stat+.stat{padding-left:10px}
  .fact{grid-template-columns:92px minmax(0,1fr)}
  .settings{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.foot .linkbtn{color:var(--pen)}
.loading{padding-block:40px;text-align:center;color:var(--ink-2)}
</style>
</head>
