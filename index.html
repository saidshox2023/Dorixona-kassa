<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dorixonachilar kassasi</title>
<meta name="description" content="Dorixonachilar oylik kassasi: kim qancha berdi, kimda nechta kassa qoldi, olganning imzosi va dollar kursi.">
<meta name="theme-color" content="#EDF0EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1219" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kassa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=IBM+Plex+Mono:wght@500;600&family=Onest:wght@400;500;600;700&display=swap">
<style id="app-css">

:root{
  --ground:#EDF0EF; --paper:#FBFCFA; --grid:#E3E9EC; --surface:#F5F7F6;
  --ink:#18213B; --ink-2:#586277; --ink-3:#8B94A7; --line:#D3DADF;
  --pen:#2442B5; --pen-ink:#FFFFFF; --pen-soft:#E4E9FA;
  --paid:#1D7549; --paid-soft:#DFF1E6; --due:#AE3F29; --due-soft:#F7E4DE;
  --shadow:0 1px 0 rgba(24,33,59,.04), 0 10px 28px -16px rgba(24,33,59,.28);
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans:"Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1219; --paper:#151B26; --grid:#1C2432; --surface:#121822;
    --ink:#E2E6F0; --ink-2:#A0A9BC; --ink-3:#6E7890; --line:#273042;
    --pen:#8EA5FF; --pen-ink:#0E1219; --pen-soft:#1C2647;
    --paid:#63C994; --paid-soft:#123022; --due:#F1907A; --due-soft:#3A1D17;
    --shadow:0 10px 28px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1219; --paper:#151B26; --grid:#1C2432; --surface:#121822;
  --ink:#E2E6F0; --ink-2:#A0A9BC; --ink-3:#6E7890; --line:#273042;
  --pen:#8EA5FF; --pen-ink:#0E1219; --pen-soft:#1C2647;
  --paid:#63C994; --paid-soft:#123022; --due:#F1907A; --due-soft:#3A1D17;
  --shadow:0 10px 28px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:22px 128px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
h1{font-size:28px;line-height:1.15;margin:4px 0 0;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px;border-block:1px solid var(--line)}
.stat{padding-block:12px;min-width:0}
.stat+.stat{border-left:1px solid var(--line);padding-left:14px}
.stat .k{font-size:12px;color:var(--ink-2)}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
.stat .s{font-size:12px;color:var(--ink-3)}

.tabs{display:flex;margin-top:14px;border-bottom:1px solid var(--line)}
.tab{flex:1;appearance:none;border:0;background:none;padding:12px 0 10px;font-weight:600;font-size:14px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--pen);border-bottom-color:var(--pen)}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn.lg{min-height:50px;padding:12px 26px;font-size:16px}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--pen-ink)}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.danger{color:var(--due)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 13px;font-weight:500;font-size:13px;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--pen);border-color:var(--pen)}

.sheet{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px;border:1px solid var(--line);border-radius:4px;padding:18px 16px 16px;box-shadow:var(--shadow)}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--pen);margin-bottom:6px}
.hand{font-family:var(--hand);font-weight:600;font-size:24px;line-height:1}
.hand-lg{font-size:36px}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;align-items:center;gap:10px;min-height:44px}
.rows.edit .row{grid-template-columns:22px minmax(0,1fr) 84px 44px 28px;gap:8px}
.no{font-family:var(--mono);color:var(--ink-3);font-size:13px}
.nm{font-weight:500;overflow-wrap:anywhere}
.took{font-size:22px;color:var(--pen);margin-left:4px;white-space:nowrap}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row.due .amt{color:var(--due)}
.mark{justify-self:end;display:flex;align-items:center;justify-content:center;min-width:44px;height:36px;color:var(--pen);background:none;border:0;padding:0}
.mark .tick{width:32px;height:24px}
.pending{font-size:11px;color:var(--due);font-weight:600;background:var(--due-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
button.mark{cursor:pointer;border-radius:8px}
button.mark:hover{background:var(--pen-soft)}
.box{width:22px;height:22px;border:1.5px dashed var(--ink-3);border-radius:4px}
.x{appearance:none;border:0;background:none;color:var(--ink-3);font-size:20px;line-height:1;width:28px;height:36px;cursor:pointer;border-radius:6px}
.x:hover{color:var(--due);background:var(--due-soft)}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:10px;border-top:2px solid var(--pen)}
.sum .lbl{font-size:13px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.big{font-size:26px}
.bar{height:6px;background:var(--pen-soft);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--paid);border-radius:3px}
.collect{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink-2);margin-top:8px}
.collect b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.collect .d b{color:var(--due)}
.unpaid{margin:12px 0 0;font-size:13px;color:var(--due);background:var(--due-soft);padding:8px 10px;border-radius:6px}
.allpaid{margin:12px 0 0;font-size:13px;color:var(--paid);background:var(--paid-soft);padding:8px 10px;border-radius:6px;font-weight:600}
.addrow{display:flex;gap:8px;margin-top:12px}

h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);font-weight:600;margin:26px 0 6px}
.facts{margin:0}
.fact{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.fact dt{color:var(--ink-2);font-size:13px;padding-top:1px}
.fact dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.fact dd small{display:block;color:var(--ink-2);font-weight:400;font-size:13px}
.fact .in{margin-top:-4px}

.won{margin-top:14px;padding:14px 16px;border-radius:8px;background:var(--pen-soft);display:grid;gap:12px}
.won-top{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.won .k{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.won .hand{font-size:34px;color:var(--pen)}
.won .r{text-align:right}
.won .r small{display:block;font-size:12px;color:var(--ink-2)}
.won.none{background:var(--surface);border:1px dashed var(--line);color:var(--ink-2);font-size:14px}
.won-edit{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.won-edit select{flex:1 1 200px}
.del{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-2)}

.in{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0;font-size:15px}
.in:focus{border-color:var(--pen);outline:none;box-shadow:0 0 0 3px var(--pen-soft)}
.amt-in{font-family:var(--mono);text-align:right;padding:6px 7px;font-size:14px}
select.in{padding-right:28px}

.summary{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);padding-block:14px 4px}
.summary b{font-family:var(--mono);color:var(--ink);font-weight:600}
.summary .d b{color:var(--due)}
.mlist{list-style:none;margin:0;padding:0}
.mrow{border-bottom:1px solid var(--line)}
.mbtn{appearance:none;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;text-align:left;background:none;border:0;padding-block:13px;cursor:pointer;align-items:center}
.mname{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.mmeta{grid-column:1 / -1;font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.mmeta b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.pill{font-size:12px;line-height:1.4;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--paid-soft);color:var(--paid)}
.pill.due{background:var(--due-soft);color:var(--due)}
.pill.won{background:var(--pen-soft);color:var(--pen)}
.pill.out{background:var(--surface);color:var(--ink-3);border:1px solid var(--line)}
.dots{display:inline-flex;gap:3px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pen)}
.dot.half{background:linear-gradient(90deg,var(--pen) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--pen)}
.dot.used{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.dot.used.half{background:linear-gradient(90deg,transparent 50%,transparent 50%)}
.hist{list-style:none;margin:0 0 12px;padding:10px 12px;background:var(--surface);border-radius:6px;font-size:13px}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding-block:4px;align-items:center}
.hist .amt{font-size:13px}
.hist .muted{color:var(--ink-3)}
.medit{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding-block:10px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.stepper button{appearance:none;border:0;background:none;width:34px;height:38px;font-size:18px;cursor:pointer;color:var(--pen)}
.stepper span{min-width:62px;text-align:center;font-size:12px;line-height:1.2;color:var(--ink-2)}
.stepper span b{display:block;font-family:var(--mono);font-size:14px;color:var(--ink)}
.addform{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;margin-top:14px}
.note{font-size:13px;color:var(--ink-2);margin:10px 0 0}
.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.settings label{font-size:12px;color:var(--ink-2);display:grid;gap:4px}
.settings label:first-child{grid-column:1 / -1}

.lotstrip{display:grid;grid-template-columns:repeat(auto-fill,32px);gap:5px;margin-top:14px}
.lot{width:32px;height:32px;border:1px dashed var(--line);border-radius:3px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.lot.won{background:var(--pen);border:1px solid var(--pen);color:var(--pen-ink);font-weight:600}
.lotnote{font-size:13px;color:var(--ink-2);margin:10px 0 0}
.lotnote b{color:var(--ink);font-family:var(--mono);font-weight:600}
.lotnote strong{color:var(--ink);font-weight:600}
.ltable{margin-top:6px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 48px 48px 56px;gap:8px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.lhead{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em;font-weight:600;padding-block:6px}
.lhead span:not(:first-child),.lrow .n{text-align:right}
.lrow .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px}
.lrow .n.left{font-weight:600;color:var(--pen);font-size:18px}
.lrow.done .lname,.lrow.done .n{color:var(--ink-3)}
.lname{font-weight:600;overflow-wrap:anywhere;display:grid;gap:4px}
.sign{display:grid;gap:4px}
.sigline{height:88px;border-bottom:1.5px solid var(--ink-3);color:var(--pen)}
.sig{display:block;width:100%;height:100%}
.sigcap{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
.sigmini{display:block;width:96px;height:38px;color:var(--pen)}
.pad{background:var(--paper);border:1.5px solid var(--pen);border-radius:8px;padding:12px;display:grid;gap:10px}
.pad-k{font-size:14px;line-height:1.45}
.pad-k b{font-weight:600}
.pad canvas{display:block;width:100%;aspect-ratio:5/2;max-width:100%;touch-action:none;color:var(--pen);background-color:var(--surface);background-image:linear-gradient(transparent calc(78% - 1px),var(--ink-3) calc(78% - 1px),var(--ink-3) 78%,transparent 78%);border-radius:6px;cursor:crosshair}
.pad-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.conv{text-align:right;font-size:12px;color:var(--ink-2);font-family:var(--mono);margin-top:2px}
.foot{margin-top:36px;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--ink-3);text-decoration:underline;cursor:pointer;font-size:12px}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:9px;border-bottom:1px solid var(--line)}
.plist .amt{font-size:14px}
.plist .rt{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.plist small{color:var(--ink-2);font-size:12px;display:block}
.empty{color:var(--ink-2);padding-block:20px}
.muted{color:var(--ink-3)}

.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);padding-inline:16px;padding-block:12px calc(12px + env(safe-area-inset-bottom));z-index:5}
.savebar .in-bar{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.savebar .msg{font-size:14px;font-weight:500}
.savebar .btn{background:transparent;color:var(--paper);border-color:var(--ink-3)}
.savebar .btn.primary{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.savebar .acts{display:flex;gap:8px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;font-size:14px;z-index:6;box-shadow:var(--shadow)}
@media (max-width:420px){
  h1{font-size:24px}
  .stat .v{font-size:17px}
  .stat+.stat{padding-left:10px}
  .fact{grid-template-columns:92px minmax(0,1fr)}
  .settings{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.foot .linkbtn{color:var(--pen)}
.loading{padding-block:40px;text-align:center;color:var(--ink-2)}
.ph{display:block;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;overflow:hidden;cursor:zoom-in;width:100%;max-width:340px;margin-top:8px}
.ph img{display:block;width:100%;height:auto;max-height:240px;object-fit:cover}
.ph-wait{display:flex;align-items:center;justify-content:center;min-height:64px;font-size:13px;color:var(--ink-3);cursor:default;border-style:dashed}
.ph-win{max-width:100%}
.ph-win img{max-height:300px;object-fit:cover}
.ph-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(10,14,22,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.lightbox img{max-width:100%;max-height:82vh;border-radius:6px;object-fit:contain}
.lightbox .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.row.away .nm,.row.away .amt{opacity:.72}
.chip-away{font-size:11px;font-weight:600;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);padding:2px 7px;border-radius:999px;margin-left:6px;white-space:nowrap}
.chip-t{appearance:none;border:1px solid var(--pen);background:var(--pen-soft);color:var(--pen);border-radius:999px;padding:5px 11px;font:600 13px var(--sans);margin:0 6px 6px 0;cursor:pointer}
.chip-t.off{border-color:var(--line);background:var(--surface);color:var(--ink-3);text-decoration:line-through}
.guest-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:4px}
.guest-edit{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:8px;align-items:center;margin-bottom:8px}
</style>
</head>

function removePhoto(kind,m){

  var outH=out.filter(function(m){return st[m.id]&&st[m.id].hist.length;});
  if(outH.length)h+='<h2>Chiqib ketganlar</h2><ul class="mlist">'+outH.map(function(m){return row(m,true);}).join('')+'</ul>';
  h+='<p class="note"><span class="dots"><i class="dot"></i></span> qurʼada bor · <span class="dots"><i class="dot used"></i></span> chiqib boʻlgan · <span class="dots"><i class="dot half"></i></span> yarim qurʼa</p>';
  return h;
}

function saveBar(){
  if(!dirty)return '';
  return '<div class="savebar"><div class="in-bar"><span class="msg">'+(saving?'Saqlanmoqda…':'Oʻzgarishlar saqlanmagan')+'</span><span class="acts"><button class="btn sm" data-act="discard"'+(saving?' disabled':'')+'>Bekor qilish</button><button class="btn sm primary" data-act="save"'+(saving?' disabled':'')+'>Saqlash</button></span></div></div>';
}
function footer(){
  var upd=state.updatedAt?'Yangilandi: '+esc(atTxt(state.updatedAt)):(loaded?'':'Yuklanmoqda…');
  var right=user?'<button class="linkbtn" data-act="signout">Chiqish ('+esc(user.email||'')+')</button>'
    :'<button class="linkbtn" data-act="signin">Egasi uchun kirish</button>';
  return '<div class="foot"><span>'+upd+' · v'+APP_VERSION+'</span>'+right+'</div>';
}

function render(){
  var body=ui.tab==='members'?membersView():ui.tab==='lots'?lotsView():gapsView();
  document.getElementById('app').innerHTML=header()+tabs()+'<main>'+body+'</main>'+footer()+saveBar()+zoomView();
  initPad();
}
function zoomView(){
  if(!lightbox||!photos[lightbox])return '';
  return '<div class="lightbox" data-act="close-zoom" role="dialog" aria-label="Surat"><img src="'+photos[lightbox]+'" alt="Surat"><button class="btn sm" data-act="close-zoom">Yopish</button></div>';
}
var rq=0;
function later(){if(rq)return;rq=requestAnimationFrame(function(){rq=0;var a=document.activeElement,id=a&&a.id,sel=null;try{sel=a.selectionStart;}catch(e){}render();if(id){var n=document.getElementById(id);if(n&&n!==document.activeElement){try{n.focus({preventScroll:true});if(sel!=null)n.setSelectionRange(sel,sel);}catch(e){}}}});}
function mark(){if(!dirty){dirty=true;later();}}
var tt=0;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true;},4200);}
function stash(){try{sessionStorage.setItem('kassa-ui',JSON.stringify({tab:ui.tab,gap:ui.gap,open:ui.open}));}catch(e){}}

/* ---------- signature pad ---------- */
function r2(v){return Math.round(v*2)/2;}
function toD(strokes){
  return strokes.map(function(p){
    if(!p.length)return '';
    var d='M'+p[0][0]+' '+p[0][1];
    if(p.length===1)return d+'l0.1 0';
    for(var i=1;i<p.length-1;i++)d+='Q'+p[i][0]+' '+p[i][1]+' '+r2((p[i][0]+p[i+1][0])/2)+' '+r2((p[i][1]+p[i+1][1])/2);
    var l=p[p.length-1];return d+'L'+l[0]+' '+l[1];
  }).join('');
}
function initPad(){
  var c=document.getElementById('sigpad');if(!c)return;
  var rect=c.getBoundingClientRect();if(!rect.width)return;
  var dpr=window.devicePixelRatio||1,k=rect.width/SW;
  c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.width/SW*SH*dpr);
  var ctx=c.getContext('2d');ctx.setTransform(dpr*k,0,0,dpr*k,0,0);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=3.2;ctx.strokeStyle=getComputedStyle(c).color;
  function draw(){ctx.clearRect(0,0,SW,SH);if(!sig.strokes.length)return;try{ctx.stroke(new Path2D(toD(sig.strokes)));}catch(e){}}
  function pt(e){var b=c.getBoundingClientRect(),s=SW/b.width;return [r2(Math.min(SW,Math.max(0,(e.clientX-b.left)*s))),r2(Math.min(SH,Math.max(0,(e.clientY-b.top)*s)))];}
  var curS=null;
  c.addEventListener('pointerdown',function(e){e.preventDefault();try{c.setPointerCapture(e.pointerId);}catch(err){}curS=[pt(e)];sig.strokes.push(curS);draw();});
  c.addEventListener('pointermove',function(e){if(!curS)return;e.preventDefault();var p=pt(e),l=curS[curS.length-1];if(Math.abs(p[0]-l[0])+Math.abs(p[1]-l[1])<2)return;curS.push(p);draw();});
  function end(){curS=null;}
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);c.addEventListener('pointerleave',end);
  draw();
}

/* ---------- firebase: live data + save ---------- */
onSnapshot(ref,function(snap){
  loaded=true;
  if(!snap.exists()){render();return;}
  var d=snap.data();
  if(!d||!d.members||!d.gaps){render();return;}
  var incoming={v:d.v||1,settings:d.settings||state.settings,members:d.members,gaps:d.gaps,updatedAt:d.updatedAt||''};
  saved=clone(incoming);
  if(dirty){remoteWaiting=clone(incoming);toast('Kassa boshqa qurilmada yangilandi. Saqlasangiz, sizdagi holat yoziladi.');render();return;}
  state=clone(incoming);render();
},function(err){loaded=true;toast('Maʼlumotni olishda xato: '+(err&&err.code||err));render();});

function save(){
  if(saving)return;
  if(!user){toast('Avval Google hisobingiz bilan kiring');return;}
  if(ui.sign&&sig.strokes.length){toast('Avval imzoni tasdiqlang yoki bekor qiling');return;}
  saving=true;render();
  state.updatedAt=stamp();
  var body={v:1,settings:state.settings,members:state.members,gaps:state.gaps,updatedAt:state.updatedAt,by:user.email||''};
  setDoc(ref,body).then(function(){
    saving=false;dirty=false;remoteWaiting=null;saved=clone(state);toast('Saqlandi — hamma shu zahoti koʻradi');render();
  },function(err){
    saving=false;var c=err&&err.code||'';
    if(c.indexOf('permission-denied')>=0)toast('Sizda yozish huquqi yoʻq. Kassa egasining hisobi bilan kiring.');
    else if(c.indexOf('unavailable')>=0)toast('Internet yoʻq — ulanish tiklanganda oʻzi saqlanadi.');
    else toast('Saqlanmadi: '+(err&&err.message||c));
    render();
  });
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v'),g=curGap(),price=+state.settings.lotPrice||0,m;
  switch(a){
    case 'tab':ui.tab=v;ui.del=null;stash();break;
    case 'toggle-edit':ui.edit=!ui.edit;ui.del=null;if(!ui.edit){ui.sign=null;sig.strokes=[];}break;
    case 'pick-gap':ui.gap=v;ui.del=null;ui.sign=null;sig.strokes=[];stash();break;
    case 'new-gap':
      var ng={id:uid('g'),date:newGapDate(),rows:active().map(function(x){return {m:x.id,amt:(+x.lots||0)*price,paid:false};}),winners:[],signs:{},guests:[],rate:0,place:'',food:'',expense:0,note:''};
      state.gaps.push(ng);ui.gap=ng.id;ui.sign=null;dirty=true;toast(gapNo(ng)+'-gap ochildi');break;
    case 'toggle-paid':if(g){var r=g.rows[+v];r.paid=!r.paid;dirty=true;}break;
    case 'toggle-away':if(g){var ra=g.rows[+v];if(ra.away)delete ra.away;else ra.away=true;dirty=true;}break;
    case 'add-guest':if(g){g.guests=guests(g).concat([{name:'',paid:false}]);dirty=true;}break;
    case 'rm-guest':if(g&&g.guests){g.guests.splice(+v,1);dirty=true;}break;
    case 'guest-paid':if(g&&g.guests&&g.guests[+v]){g.guests[+v].paid=!g.guests[+v].paid;dirty=true;}break;
    case 'rm-row':if(g){g.rows.splice(+v,1);dirty=true;}break;
    case 'add-row':var sel=document.getElementById('add-row-sel');if(g&&sel&&sel.value){m=member(sel.value);g.rows.push({m:m.id,amt:(+m.lots||0)*price,paid:false});dirty=true;}break;
    case 'del-gap':ui.del=g&&g.id;break;
    case 'del-gap-no':ui.del=null;break;
    case 'del-gap-yes':
      if(g){
        var ids=[];if(g.photos){if(g.photos.food)ids.push(g.photos.food);Object.keys(g.photos.win||{}).forEach(function(k){ids.push(g.photos.win[k]);});}
        ids.forEach(function(pid){deleteDoc(doc(fdb,'kassa',pid)).catch(function(){});});
        state.gaps=state.gaps.filter(function(x){return x.id!==g.id;});ui.gap=null;ui.del=null;ui.sign=null;dirty=true;toast('Gap oʻchirildi');
      }break;
    case 'pick-photo':var pv=String(v).split(':');pickPhoto(pv[0],pv[1]||'');return;
    case 'rm-photo':var rv=String(v).split(':');removePhoto(rv[0],rv[1]||'');return;
    case 'zoom':lightbox=v;break;
    case 'close-zoom':lightbox=null;break;
    case 'sig-open':if(g){ui.sign={g:g.id,m:v};sig.strokes=[];}break;
    case 'sig-clear':sig.strokes=[];break;
    case 'sig-cancel':ui.sign=null;sig.strokes=[];break;
    case 'sig-ok':
      if(!g||!ui.sign)return;
      if(!sig.strokes.some(function(s){return s.length>1;})){toast('Avval imzo qoʻying');return;}
      g.signs=g.signs||{};g.signs[ui.sign.m]={d:toD(sig.strokes),at:stamp()};
      ui.sign=null;sig.strokes=[];dirty=true;toast('Imzo qoʻyildi — endi “Saqlash”ni bosing');break;
    case 'open':ui.open=ui.open===v?null:v;stash();break;
    case 'lots-':case 'lots+':m=member(v);m.lots=Math.max(0.5,Math.round(((+m.lots||0)+(a==='lots+'?0.5:-0.5))*2)/2);dirty=true;break;
    case 'deact':
      m=member(v);var used=state.gaps.some(function(x){return x.rows.some(function(r){return r.m===v;})||(x.winners||[]).some(function(w){return w.m===v;});});
      if(used)m.active=false;else state.members=state.members.filter(function(x){return x.id!==v;});
      dirty=true;toast(m.name+(used?' roʻyxatdan chiqarildi (tarixi saqlanadi)':' oʻchirildi'));break;
    case 'react':m=member(v);delete m.active;dirty=true;break;
    case 'add-member':
      var ni=document.getElementById('new-name'),nl=document.getElementById('new-lots'),nm=(ni&&ni.value||'').trim();
      if(!nm){toast('Avval ismini yozing');if(ni)ni.focus();return;}
      state.members.push({id:uid('m'),name:nm,lots:+(nl&&nl.value)||1});dirty=true;toast(nm+' qoʻshildi');break;
    case 'save':save();return;
    case 'discard':
      state=clone(remoteWaiting||saved);dirty=false;remoteWaiting=null;ui.del=null;ui.sign=null;sig.strokes=[];toast('Oʻzgarishlar bekor qilindi');break;
    case 'signin':doSignIn();return;
    case 'signout':signOut(auth);return;
    default:return;
  }
  render();
});
document.addEventListener('input',function(e){
  var el=e.target,f=el.getAttribute&&el.getAttribute('data-f');if(!f)return;
  var g=curGap(),v=el.value;
  switch(f){
    case 'amt':if(g&&g.rows[+el.getAttribute('data-v')])g.rows[+el.getAttribute('data-v')].amt=toNum(v);break;
    case 'g-date':if(g&&v)g.date=v;break;
    case 'g-rate':if(g)g.rate=toNum(v);break;
    case 'g-place':if(g)g.place=v;break;
    case 'g-food':if(g)g.food=v;break;
    case 'g-exp':if(g)g.expense=toNum(v);break;
    case 'g-note':if(g)g.note=v;break;
    case 'guest-name':if(g&&g.guests&&g.guests[+el.getAttribute('data-v')])g.guests[+el.getAttribute('data-v')].name=v;break;
    case 'mname':var m=member(el.getAttribute('data-v'));m.name=v;break;
    case 'set-name':state.settings.name=v;break;
    case 'set-price':state.settings.lotPrice=toNum(v);break;
    case 'set-cur':state.settings.cur=v.trim().slice(0,4)||'$';break;
    case 'set-day':var d=Math.round(toNum(v));if(d>=1&&d<=28)state.settings.day=d;break;
    case 'g-win':
      if(g){
        if(!v)g.winners=[];else{var p=v.split('|'),ids=p[0].split('+'),part=+p[1]||1;g.winners=ids.map(function(id){return {m:id,part:part};});}
        var keep={};(g.signs&&Object.keys(g.signs)||[]).forEach(function(id){if(g.winners.some(function(w){return w.m===id;}))keep[id]=g.signs[id];});g.signs=keep;
        ui.sign=null;sig.strokes=[];
      }
      dirty=true;later();return;
    default:return;
  }
  mark();
});
document.addEventListener('change',function(e){var f=e.target.getAttribute&&e.target.getAttribute('data-f');if(f&&f!=='g-win')later();});
var rz=0;window.addEventListener('resize',function(){if(!document.getElementById('sigpad'))return;clearTimeout(rz);rz=setTimeout(initPad,150);});
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});

/* ---------- auth ---------- */
function doSignIn(){
  var p=new GoogleAuthProvider();
  signInWithPopup(auth,p).catch(function(err){
    var c=err&&err.code||'';
    if(c.indexOf('popup')>=0){signInWithRedirect(auth,p);return;}
    toast('Kirishda xato: '+(err&&err.message||c));
  });
}
onAuthStateChanged(auth,function(u){
  user=u||null;canEdit=!!u;
  if(!u){ui.edit=false;ui.sign=null;}
  render();
  if(u)seedIfEmpty();
});
function seedIfEmpty(){
  getDoc(ref).then(function(snap){
    if(snap.exists())return;
    var body={v:1,settings:state.settings,members:state.members,gaps:state.gaps,updatedAt:stamp(),by:(user&&user.email)||''};
    return setDoc(ref,body).then(function(){toast('Kassa maʼlumoti Firebase\'ga yozildi');});
  }).catch(function(err){
    var c=err&&err.code||'';
    if(c.indexOf('permission-denied')>=0)toast('Bu hisobda yozish huquqi yoʻq.');
  });
}

render();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});

</script>
